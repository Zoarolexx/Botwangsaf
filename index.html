<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOTZEROZXTEST - Pairing Code</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0a0f, #0f0f1a);
    font-family: 'Segoe UI', system-ui, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: rgba(20, 20, 35, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 32px;
    padding: 32px;
    max-width: 500px;
    width: 100%;
    border: 1px solid rgba(0, 255, 200, 0.2);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 28px;
    text-align: center;
    background: linear-gradient(135deg, #00ffcc, #b400ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .sub {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-bottom: 28px;
  }
  .status-bot {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 12px;
    font-family: monospace;
  }
  .status-online {
    color: #00ffcc;
  }
  .status-offline {
    color: #ff4444;
  }
  input {
    width: 100%;
    padding: 14px 16px;
    background: #1a1a2e;
    border: 1px solid #2a2a4e;
    border-radius: 14px;
    color: white;
    font-size: 16px;
    margin-bottom: 16px;
    font-family: monospace;
  }
  input:focus {
    outline: none;
    border-color: #00ffcc;
  }
  .captcha-box {
    background: #1a1a2e;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .captcha-question {
    font-size: 20px;
    text-align: center;
    padding: 10px;
    background: #0a0a0f;
    border-radius: 10px;
    margin-bottom: 12px;
    color: #00ffcc;
    font-family: monospace;
    font-weight: bold;
  }
  .captcha-options {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .captcha-btn {
    padding: 10px;
    background: #2a2a4e;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-family: monospace;
    font-weight: bold;
  }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #00ffcc, #00997a);
    border: none;
    border-radius: 14px;
    color: #000;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 14px;
    display: none;
  }
  .success {
    background: rgba(0,255,200,0.1);
    border: 1px solid #00ffcc;
    display: block;
  }
  .error {
    background: rgba(255,68,68,0.1);
    border: 1px solid #ff4444;
    display: block;
  }
  .pairing-code {
    font-size: 32px;
    text-align: center;
    font-family: monospace;
    font-weight: bold;
    letter-spacing: 4px;
    color: #00ffcc;
    background: #0a0a0f;
    padding: 16px;
    border-radius: 12px;
    margin: 12px 0;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #00ffcc;
    color: #000;
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="card">
  <h1>⚡ BOTZEROZXTEST ⚡</h1>
  <div class="sub">WhatsApp Bot Multi Fitur</div>
  
  <div class="status-bot" id="statusBot">
    🔄 Mengecek koneksi bot...
  </div>
  
  <input type="number" id="nomor" placeholder="628123456789" autocomplete="off">
  
  <div class="captcha-box">
    <div class="captcha-question" id="captchaQuestion">Loading...</div>
    <div class="captcha-options" id="captchaOptions"></div>
    <div id="captchaStatus" style="text-align:center; font-size:11px; margin-top:8px;"></div>
  </div>
  
  <button id="btnBuat" disabled>🚀 BUAT BOT & DAPATKAN PAIRING CODE</button>
  
  <div id="result" class="result"></div>
</div>
<div class="toast" id="toast">✅ Tersalin!</div>

<script>
  let captchaPassed = false;
  let currentAnswer = 0;
  
  // Cek status bot
  async function checkStatus() {
    try {
      const res = await fetch('/status');
      const data = await res.json();
      const statusDiv = document.getElementById('statusBot');
      if (data.connected) {
        statusDiv.innerHTML = '✅ BOT ONLINE - SIAP PAIRING ✅<br>' + 
          `<span style="font-size:10px">Nomor Bot: ${data.botNumber || '?'}</span>`;
        statusDiv.className = 'status-bot status-online';
      } else {
        statusDiv.innerHTML = '⚠️ BOT OFFLINE - TUNGGU 10 DETIK ⚠️<br><span style="font-size:10px">Bot sedang memulai...</span>';
        statusDiv.className = 'status-bot status-offline';
      }
    } catch(e) {
      document.getElementById('statusBot').innerHTML = '❌ GAGAL KONEK KE SERVER ❌';
    }
  }
  checkStatus();
  setInterval(checkStatus, 5000);
  
  // Captcha
  function generateCaptcha() {
    const a = Math.floor(Math.random() * 12) + 2;
    const b = Math.floor(Math.random() * 12) + 2;
    const ops = [
      { text: `${a} + ${b}`, ans: a + b },
      { text: `${a + b} - ${b}`, ans: a },
      { text: `${a} × ${b}`, ans: a * b }
    ];
    const selected = ops[Math.floor(Math.random() * ops.length)];
    currentAnswer = selected.ans;
    document.getElementById('captchaQuestion').innerHTML = selected.text + ' = ?';
    
    const options = new Set([currentAnswer]);
    while(options.size < 4) {
      let w = currentAnswer + Math.floor(Math.random() * 11) - 5;
      if(w > 0) options.add(w);
    }
    const shuffled = [...options].sort(() => Math.random() - 0.5);
    const container = document.getElementById('captchaOptions');
    container.innerHTML = '';
    shuffled.forEach(val => {
      const btn = document.createElement('button');
      btn.className = 'captcha-btn';
      btn.textContent = val;
      btn.onclick = () => {
        if(val === currentAnswer) {
          captchaPassed = true;
          document.getElementById('captchaStatus').innerHTML = '✅ Verifikasi berhasil!';
          document.getElementById('btnBuat').disabled = false;
        } else {
          btn.style.background = '#ff4444';
          setTimeout(() => btn.style.background = '#2a2a4e', 500);
          document.getElementById('captchaStatus').innerHTML = '❌ Salah, coba lagi';
        }
      };
      container.appendChild(btn);
    });
  }
  generateCaptcha();
  
  async function createBot() {
    const nomor = document.getElementById('nomor').value.trim();
    if(!nomor) {
      alert('Masukkan nomor WhatsApp!');
      return;
    }
    if(!captchaPassed) {
      alert('Selesaikan captcha dulu!');
      return;
    }
    
    const btn = document.getElementById('btnBuat');
    const resultDiv = document.getElementById('result');
    btn.disabled = true;
    btn.textContent = '⏳ MEMPROSES...';
    resultDiv.style.display = 'none';
    
    try {
      const res = await fetch('/jadibot2', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nomor: nomor })
      });
      const data = await res.json();
      
      if(data.status) {
        resultDiv.className = 'result success';
        resultDiv.innerHTML = `
          <div style="text-align:center">
            ✅ <strong>BERHASIL!</strong><br><br>
            <div class="pairing-code">${data.pairing_code}</div>
            <p style="font-size:12px; margin:10px 0">
              📱 <strong>CARA PAIRING:</strong><br>
              1. Buka WhatsApp → Setelan → Perangkat Tertaut<br>
              2. Tap "Tautkan Perangkat"<br>
              3. Masukkan kode: <strong>${data.pairing_code}</strong>
            </p>
            <button onclick="navigator.clipboard.writeText('${data.pairing_code}'); alert('✅ Kode disalin!')" 
              style="background:#2a2a4e; color:#00ffcc; margin-top:8px;">
              📋 SALIN KODE
            </button>
          </div>
        `;
      } else {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `<div style="text-align:center">❌ ${data.error}</div>`;
      }
    } catch(e) {
      resultDiv.className = 'result error';
      resultDiv.innerHTML = `<div style="text-align:center">❌ Gagal konek ke server: ${e.message}</div>`;
    }
    
    btn.disabled = false;
    btn.textContent = '🚀 BUAT BOT & DAPATKAN PAIRING CODE';
    captchaPassed = false;
    generateCaptcha();
    document.getElementById('btnBuat').disabled = true;
  }
  
  document.getElementById('btnBuat').onclick = createBot;
</script>
</body>
</html>
